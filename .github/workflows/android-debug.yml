name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - ew/mobile-first
      - ew/zh-localization-next
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.png"
      - "**.svg"
      - "project.godot"
      - "export_presets.cfg"
      - "export_presets.cfg"
      - "versions.cfg"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1 unzip
          rm -rf /var/lib/apt/lists/*

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Create Android debug signing key
        run: |
          rm -f /root/debug.keystore
          keytool -genkeypair -v -keystore /root/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -storetype pkcs12

      - name: Prepare Android Gradle template
        run: |
          BUILD_VERSION=$(godot --version | sed -E 's/\.(official|custom_build)\..*$//')
          mkdir -p android/build
          unzip -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "$BUILD_VERSION" > android/.build_version

      - name: Import project assets
        run: godot --headless --editor --import --quit

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/XiaYe-zh-preview-debug.apk

      - name: Verify APK exists
        run: |
          test -s build/android/Eternal-World-debug.apk
          ls -lh build/android/Eternal-World-debug.apk
          unzip -t build/android/Eternal-World-debug.apk >/dev/null
          echo "APK archive integrity: OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: XiaYe-ZH-Preview-Android-Debug
          path: build/android/Eternal-World-debug.apk
          if-no-files-found: error
          retention-days: 14
