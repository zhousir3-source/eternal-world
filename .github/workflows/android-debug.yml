name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - ew/mobile-first
      - ew/zh-localization-next
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.png"
      - "**.svg"
      - "**.ttf"
      - "**.otf"
      - "**.ttc"
      - "**.json"
      - "**.csv"
      - "**.po"
      - "**.translation"
      - "data/maps/**"
      - "project.godot"
      - "export_presets.cfg"
      - "versions.cfg"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1 unzip fonts-noto-cjk python3-fonttools
          rm -rf /var/lib/apt/lists/*

      - name: Verify Godot and Android export templates
        run: |
          set -eu
          godot --version
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_source.zip"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          echo "Godot export templates available: $TEMPLATE_DIR"

      - name: Create Android debug signing key
        run: |
          rm -f /root/debug.keystore
          keytool -genkeypair -v -keystore /root/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -storetype pkcs12

      - name: Prepare Android Gradle template
        run: |
          BUILD_VERSION=$(godot --version | sed -E 's/\.(official|custom_build)\..*$//')
          mkdir -p android/build
          unzip -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "$BUILD_VERSION" > android/.build_version

      - name: Extract Simplified Chinese font face
        run: |
          FONT_SOURCE=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -s "$FONT_SOURCE"
          mkdir -p data/graphics/fonts
          python3 - <<'PY'
          from fontTools.ttLib import TTCollection
          collection = TTCollection('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc')
          # Select by metadata rather than assuming the TTC face order.
          def names(font):
              return {record.toUnicode() for record in font['name'].names if record.nameID in (1, 4, 6)}
          candidates = [font for font in collection.fonts if any('Noto Sans CJK SC' in name for name in names(font))]
          if len(candidates) != 1:
              raise SystemExit(f'Expected one Simplified Chinese font face, found {len(candidates)}')
          font = candidates[0]
          from pathlib import Path
          import re
          # Validate every Han character in player-visible source assets, not only a sample.
          text_extensions = {'.gd', '.tscn', '.tres', '.json', '.csv', '.po'}
          roots = [Path('sources'), Path('presets'), Path('data')]
          required = set('夏叶男女创建角色保存读取背包装备技能任务设置退出确认中文字体')
          scanned = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_extensions:
                      continue
                  try:
                      contents = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  required.update(re.findall(r'[\u3400-\u9fff]', contents))
                  scanned += 1
          # Fail closed if repository paths change or text scanning silently stops working.
          if scanned == 0:
              raise SystemExit('No text assets scanned; refusing to certify Chinese font coverage')
          if len(required) == len(set('夏叶男女创建角色保存读取背包装备技能任务设置退出确认中文字体')):
              raise SystemExit('No Chinese glyphs discovered in project assets; check scanner paths and regex')
          supported = set().union(*(set(table.cmap) for table in font['cmap'].tables if table.isUnicode()))
          missing = sorted(character for character in required if ord(character) not in supported)
          if missing:
              raise SystemExit(f'Chinese UI font is missing {len(missing)} glyphs: {"".join(missing)}')
          print('Selected font face:', sorted(names(font)))
          print('Scanned text assets:', scanned)
          print('Verified Chinese glyphs:', len(required))
          font.flavor = None
          font.save('data/graphics/fonts/NotoSansSC-Regular.ttf')
          PY
          test -s data/graphics/fonts/NotoSansSC-Regular.ttf
          ls -lh data/graphics/fonts/NotoSansSC-Regular.ttf

      - name: Import project assets
        run: godot --headless --editor --import --quit

      - name: Validate project loads
        run: godot --headless --path . --editor --quit

      - name: Verify current theme font resources
        run: |
          test -f data/graphics/fonts/alagard-16.ttf
          test -f data/graphics/fonts/romulus-16.ttf
          test -s data/graphics/fonts/NotoSansSC-Regular.ttf
          grep -q 'default_font = ExtResource("31_cjk")' data/themes/DefaultTheme.tres
          echo "Bundled Noto CJK font is configured as the default UI font."

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/XiaYe-zh-preview-debug.apk

      - name: Verify APK exists
        run: |
          test -s build/android/XiaYe-zh-preview-debug.apk
          ls -lh build/android/XiaYe-zh-preview-debug.apk
          unzip -t build/android/XiaYe-zh-preview-debug.apk >/dev/null
          echo "APK archive integrity: OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: XiaYe-ZH-Preview-Android-Debug
          path: build/android/XiaYe-zh-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
